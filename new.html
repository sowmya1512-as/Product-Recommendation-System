<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Insights</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 3rem 2rem;
      text-align: center;
      color: white;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.95;
      font-weight: 300;
    }

    .content-wrapper {
      padding: 2.5rem;
    }

    .mode-selector {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      background: #f8f9fa;
      padding: 0.5rem;
      border-radius: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 0.875rem 1.5rem;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #6c757d;
    }

    .mode-btn:hover {
      background: rgba(102, 126, 234, 0.1);
      color: #667eea;
    }

    .mode-btn.active {
      background: white;
      color: #667eea;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .input-group-custom {
      margin-bottom: 1.5rem;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 1rem;
    }

    .input-wrapper i {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      color: #adb5bd;
      font-size: 1.1rem;
    }

    .input-custom {
      width: 100%;
      padding: 1rem 1rem 1rem 3.25rem;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: white;
    }

    .input-custom:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .input-custom::placeholder {
      color: #adb5bd;
    }

    .analyze-btn {
      width: 100%;
      padding: 1.125rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.125rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .analyze-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .analyze-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results-section {
      margin-top: 2.5rem;
    }

    .product-card {
      background: white;
      border: 2px solid #f1f3f5;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
    }

    .product-card:hover {
      border-color: #667eea;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
    }

    .product-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #212529;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .product-title i {
      color: #667eea;
      font-size: 1.5rem;
    }

    .price-tag {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #495057;
      margin: 1.5rem 0 1rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pros-list, .cons-list {
      list-style: none;
      padding: 0;
    }

    .pros-list li, .cons-list li {
      padding: 0.75rem 0 0.75rem 2.5rem;
      position: relative;
      line-height: 1.6;
      color: #495057;
    }

    .pros-list li:before {
      content: "\f00c";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      left: 0;
      top: 0.75rem;
      width: 1.75rem;
      height: 1.75rem;
      background: #d4edda;
      color: #28a745;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .cons-list li:before {
      content: "\f00d";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      left: 0;
      top: 0.75rem;
      width: 1.75rem;
      height: 1.75rem;
      background: #f8d7da;
      color: #dc3545;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .ranking-box {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 1.25rem;
      border-radius: 8px;
      margin-top: 1rem;
      line-height: 1.7;
      color: #495057;
    }

    .comparison-table {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin: 1.5rem 0;
    }

    .comparison-table th {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1rem;
      font-weight: 600;
      text-align: center;
    }

    .comparison-table td {
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid #f1f3f5;
      color: #495057;
    }

    .comparison-table tr:last-child td {
      border-bottom: none;
    }

    .verdict-card {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border: 2px solid #667eea;
      border-radius: 16px;
      padding: 2rem;
      margin-top: 2rem;
    }

    .verdict-card h3 {
      color: #667eea;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.5rem;
    }

    .verdict-card p {
      color: #495057;
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .sources-tag {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: white;
      border-radius: 8px;
      display: inline-block;
      font-size: 0.9rem;
      color: #6c757d;
    }

    .price-summary-card {
      background: white;
      border: 2px solid #f1f3f5;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }

    .price-summary-card strong {
      color: #667eea;
      font-size: 1.1rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: #adb5bd;
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }
      
      .content-wrapper {
        padding: 1.5rem;
      }
      
      .mode-selector {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="header">
      <h1><i class="fas fa-shopping-bag"></i> Product Insights</h1>
      <p>Make informed decisions with AI-powered analysis</p>
    </div>

    <div class="content-wrapper">
      <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('proscons')">
          <i class="fas fa-list-ul"></i> Pros & Cons
        </button>
        <button class="mode-btn" onclick="setMode('compare')">
          <i class="fas fa-balance-scale"></i> Compare Products
        </button>
      </div>

      <div class="input-group-custom">
        <div class="input-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="product1" class="input-custom" placeholder="Enter first product name...">
        </div>
        <div class="input-wrapper" id="product2Wrapper" style="display: none;">
          <i class="fas fa-search"></i>
          <input type="text" id="product2" class="input-custom" placeholder="Enter second product name...">
        </div>
      </div>

      <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">
        <i class="fas fa-magic"></i> Analyze Products
      </button>

      <div class="results-section" id="resultsSection">
        <div class="empty-state">
          <i class="fas fa-chart-line"></i>
          <p>Enter product names above to get started</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentMode = 'proscons';

    function setMode(mode) {
      currentMode = mode;
      const buttons = document.querySelectorAll('.mode-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.closest('.mode-btn').classList.add('active');
      
      const product2Wrapper = document.getElementById('product2Wrapper');
      product2Wrapper.style.display = mode === 'compare' ? 'block' : 'none';
    }

    function formatPrice(p) {
      if (p === null || p === undefined) return "Not available";
      if (typeof p === "number") {
        return p.toLocaleString();
      }
      return String(p);
    }

    function renderProductCard(product) {
      const name = product?.name || "Unknown product";
      const pros = product?.pros || [];
      const cons = product?.cons || [];
      const ranking = product?.ranking_summary || "";
      const features = product?.features || {};
      
      let priceLine = "Price not available";
      if (product && product.typical_price) {
        priceLine = formatPrice(product.typical_price);
      } else if (features && features['Typical Price (raw)']) {
        priceLine = features['Typical Price (raw)'];
      } else if (features && features['Typical Price']) {
        priceLine = formatPrice(features['Typical Price']);
      }

      return `
        <div class="product-card">
          <h2 class="product-title">
            <i class="fas fa-box"></i>
            ${name}
          </h2>
          <div class="price-tag">
            <i class="fas fa-tag"></i> ${priceLine}
          </div>

          <div class="section-title">
            <i class="fas fa-thumbs-up" style="color: #28a745;"></i>
            Advantages
          </div>
          ${pros.length ? `<ul class="pros-list">${pros.map(p=>`<li>${p}</li>`).join("")}</ul>` : `<p style="color: #adb5bd; font-style: italic;">No pros found</p>`}

          <div class="section-title">
            <i class="fas fa-thumbs-down" style="color: #dc3545;"></i>
            Disadvantages
          </div>
          ${cons.length ? `<ul class="cons-list">${cons.map(c=>`<li>${c}</li>`).join("")}</ul>` : `<p style="color: #adb5bd; font-style: italic;">No cons found</p>`}

          <div class="section-title">
            <i class="fas fa-star" style="color: #ffc107;"></i>
            Ranking & Summary
          </div>
          <div class="ranking-box">${ranking || "No summary available"}</div>
        </div>
      `;
    }

    async function analyze() {
      const product1 = document.getElementById("product1").value.trim();
      const product2 = document.getElementById("product2").value.trim();
      
      if (!product1) {
        alert("Please enter the first product name.");
        return;
      }

      if (currentMode === 'compare' && !product2) {
        alert("Please enter the second product name for comparison.");
        return;
      }

      const analyzeBtn = document.getElementById('analyzeBtn');
      analyzeBtn.disabled = true;
      analyzeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';

      let url = `http://127.0.0.1:8016/analyze?product1=${encodeURIComponent(product1)}`;
      if (currentMode === 'compare' && product2) {
        url += `&product2=${encodeURIComponent(product2)}`;
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Server returned " + response.status);
        const data = await response.json();

        if (data.error && String(data.error).startsWith("MODEL_ERROR")) {
          alert("AI service error: " + data.error + "\nTry again later or check quota.");
          return;
        }

        const resultsSection = document.getElementById('resultsSection');
        
        if (currentMode === 'proscons') {
          resultsSection.innerHTML = renderProductCard(data.product1 || {});
        } else {
          if (!data.product2) {
            resultsSection.innerHTML = `<div class="product-card" style="border-color: #dc3545; background: #f8d7da;"><p style="color: #721c24;">Second product data not returned by server.</p></div>`;
            return;
          }

          const featureKeys = ["Battery", "Camera", "Price", "Performance"];
          const tableRows = featureKeys.map(f => {
            const left = (data.product1?.features && (data.product1.features[f] || data.product1.features[f.toLowerCase()])) || "-";
            const right = (data.product2?.features && (data.product2.features[f] || data.product2.features[f.toLowerCase()])) || "-";
            return `<tr><td><strong>${f}</strong></td><td>${left}</td><td>${right}</td></tr>`;
          }).join("");

          const priceSummary = data.price_summary || (data.product1?.typical_price && data.product2?.typical_price ? `${formatPrice(data.product1.typical_price)} vs ${formatPrice(data.product2.typical_price)}` : "Price comparison not available");
          const priceWinner = data.price_winner || null;

          resultsSection.innerHTML = `
            ${renderProductCard(data.product1 || {})}
            ${renderProductCard(data.product2 || {})}

            <div class="product-card">
              <h3 class="section-title" style="font-size: 1.5rem;">
                <i class="fas fa-exchange-alt"></i>
                Feature Comparison
              </h3>
              <table class="comparison-table">
                <thead>
                  <tr>
                    <th>Feature</th>
                    <th>${data.product1?.name || "Product 1"}</th>
                    <th>${data.product2?.name || "Product 2"}</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>

            <div class="verdict-card">
              <h3>
                <i class="fas fa-trophy"></i>
                Final Verdict
              </h3>
              <p>${data.verdict || "No verdict available."}</p>
              <div class="sources-tag">
                <i class="fas fa-database"></i> Data sources: Reddit + YouTube
              </div>
            </div>

            <div class="price-summary-card">
              <strong><i class="fas fa-money-bill-wave"></i> Price Summary:</strong> ${priceSummary}
              ${priceWinner ? `<div style="margin-top: 0.75rem;"><strong><i class="fas fa-award"></i> Better Value:</strong> ${priceWinner}</div>` : ""}
            </div>
          `;
        }
      } catch (err) {
        alert("Error: " + err.message);
        console.error(err);
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = '<i class="fas fa-magic"></i> Analyze Products';
      }
    }
  </script>
</body>
</html>
